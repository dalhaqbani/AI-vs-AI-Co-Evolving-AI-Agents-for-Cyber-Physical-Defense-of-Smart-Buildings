services:
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t health -C 1 -W 1 >/dev/null 2>&1 || true"]
      interval: 5s
      timeout: 2s
      retries: 3

  backend:
    build: ./backend
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      DATABASE_PATH: /data/readings.db
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/data
    depends_on:
      - mqtt

  emulator:
    build: ./emulator
    environment:
      MQTT_HOST: mqtt
      MQTT_PORT: 1883
      NODE_COUNT: 3
      PUBLISH_INTERVAL: 2
      ANOMALY_EVERY: 12
    depends_on:
      - mqtt

  web:
    build: ./web
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_data:

